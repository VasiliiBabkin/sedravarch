[package]
name = "sedravarch-desktop"
version = "0.8.1"
edition = "2021"
publish = false

[dependencies]
sedravarch = { path = ".." }
eframe = { version = "=0.32.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }

[profile.release]
lto = "thin"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
